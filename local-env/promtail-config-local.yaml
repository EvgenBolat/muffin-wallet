apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: muffin
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://host.minikube.internal:3100/loki/api/v1/push

    scrape_configs:
      - job_name: app-logs

        pipeline_stages:
          - regex:
              expression: '^\d{4}-\d{2}-\d{2}T[0-9:.]+Z\s+(?P<logLevel>[A-Z]+)\s+\[(?P<traceId>[a-f0-9]+),(?P<spanId>[a-f0-9]+)\]'
          - labels:
              traceId:
              logLevel:
              spanId:

        static_configs:
          - targets:
              - localhost
            labels:
              job: muffin-wallet
              __path__: /logs/*.log
