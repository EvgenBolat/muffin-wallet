apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muffin-wallet.fullname" . }}-config
data:
  application.yaml: |
    server:
      port: {{ .Values.containerPort }}
    spring:
      datasource:
        url: {{ .Values.datasource.url }}
        username: {{ .Values.datasource.username }}

    currency:
      service:
        url: {{ .Values.currency.url }}

    logging:
      file:
        name: {{ .Values.logging.file }}

    management:
      endpoints:
        web:
          exposure:
            include: health, info, prometheus
      endpoint:
        health:
          probes:
            enabled: true
          show-details: always
